name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: green gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm via corepack (version pinned by package.json "packageManager").
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Browser pillar (@sackville-mcp/browser) tests launch real headless browsers —
      # Chromium plus Firefox + WebKit for the multi-engine path. Install the
      # binaries + their system libs; revisions are pinned by playwright-core's
      # version in packages/browser/package.json. (Without firefox/webkit the
      # cross-engine tests skip themselves, but CI runs them for real coverage.)
      - name: Install Playwright browsers + system deps
        run: pnpm --filter @sackville-mcp/browser exec playwright-core install --with-deps chromium firefox webkit

      - name: Sync Python environment
        working-directory: py/sackville_ingest
        run: uv sync

      # Mirrors `pnpm gate`: Biome + tsc + Vitest, then Ruff + pytest.
      - name: Green gate
        run: pnpm gate

      # Ensure every package still builds.
      - name: Build
        run: pnpm build

  # Build-then-assert PACKAGING checks (ADR 0019 slices 2 + 10) — kept OUT of `pnpm gate`
  # because they need a real build + packed tarballs. No browsers/Python required.
  package-checks:
    name: package checks (attw + publint + lazy boundary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Builds, packs every publishable package, runs `attw --profile esm-only` + `publint`
      # on each tarball, then asserts the aggregate bin.mjs startup closure is native-free.
      - name: Packaging checks
        run: pnpm package-checks
